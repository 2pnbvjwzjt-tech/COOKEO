let S={page:'home',q:'',cat:'Tout',detail:null,favs:[],plan:{},day:0,pantry:[],done:[],servings:2,checked:[],budget:50,cal:1800};
try{S={...S,...JSON.parse(localStorage.getItem('cookeoV10')||'{}')}}catch(e){}
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem('cookeoV10',JSON.stringify({...S,detail:null}))}function toast(t){let e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1900)}
function go(p){S.page=p;S.detail=null;save();render()}function get(id){return RECIPES.find(r=>r.id===+id)}
function render(){$('#today').textContent=new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===S.page));if(S.detail){detail();return}({home,recipes:recipePage,planner,shopping,pantry}[S.page]||home)()}
function home(){let planned=Object.keys(S.plan).filter(k=>S.plan[k]).length;$('#app').innerHTML=`<div class="hero"><div class="eyebrow">Votre cuisine, mieux organisée</div><h2>De bonnes idées,<br>sans improviser.</h2><p class="muted">Recettes détaillées, portions ajustables et organisation des repas.</p></div><div class="stats"><div class="stat"><b>${RECIPES.length}</b><small>Fiches disponibles</small></div><div class="stat"><b>${planned}/14</b><small>Repas planifiés</small></div><div class="stat"><b>${S.pantry.length}</b><small>Produits en stock</small></div></div><div class="notice"><b>Transparence du catalogue :</b> ${RECIPES.length} fiches dans ce premier lot. Elles sont adaptées au Cookeo+ 6 L sur le plan culinaire, mais aucune n'est présentée comme physiquement testée. Les valeurs nutritionnelles, coûts et temps sont indicatifs. Objectif catalogue : 500 fiches documentées.</div><div class="tiles"><button class="tile" onclick="go('recipes')">📖<b>Explorer les recettes</b><small>Recherche et catégories</small></button><button class="tile" onclick="go('planner')">🗓️<b>Planning repas</b><small>Déjeuner et dîner</small></button><button class="tile" onclick="go('shopping')">🛒<b>Liste de courses</b><small>Calculée depuis le planning</small></button><button class="tile" onclick="go('pantry')">🥬<b>Mon stock</b><small>Quantités disponibles</small></button></div><div class="card" style="margin-top:12px"><b>Compatibilité Cookeo+</b><p class="muted">Cuve 6 L · jusqu'à 6 personnes · cuisson sous pression, dorage, vapeur et mijotage.</p><p class="muted">Pour la pression, respecter la quantité minimale de liquide et les limites de remplissage indiquées dans la notice de votre appareil.</p></div>`}
function recipePage(){let cats=['Tout',...new Set(RECIPES.map(r=>r.category))];let list=RECIPES.filter(r=>(S.cat==='Tout'||r.category===S.cat)&&(`${r.title} ${r.category} ${r.ingredients.map(x=>x.name).join(' ')}`).toLowerCase().includes(S.q.toLowerCase()));$('#app').innerHTML=`<div class="eyebrow">Bibliothèque culinaire</div><h2>${RECIPES.length} recettes</h2><input class="input" placeholder="Rechercher un plat, un ingrédient…" value="${esc(S.q)}" oninput="S.q=this.value;let p=this.selectionStart;recipePage();let x=$('#app input');x.focus();x.setSelectionRange(p,p)"><div class="filters">${cats.map(c=>`<button class="filter ${S.cat===c?'active':''}" onclick="S.cat='${esc(c)}';recipePage()">${esc(c)}</button>`).join('')}</div>${list.map(r=>`<div class="recipe"><div class="food">${r.emoji}</div><div><b>${esc(r.title)}</b><div class="meta">${r.category} · ${r.prep_minutes+r.cook_minutes} min · ${r.kcal} kcal/portion</div><div class="actions"><button onclick="S.detail=${r.id};render()">Voir la fiche</button><button onclick="toggleFav(${r.id})">${S.favs.includes(r.id)?'★ Favori':'☆ Favori'}</button></div></div></div>`).join('')||'<p class="muted">Aucun résultat.</p>'}`}
function toggleFav(id){S.favs=S.favs.includes(id)?S.favs.filter(x=>x!==id):[...S.favs,id];save();recipePage()}
function detail(){let r=get(S.detail);if(!r){S.detail=null;render();return}let scale=S.servings/r.servings;$('#app').innerHTML=`<button class="btn light" onclick="S.detail=null;render()">← Retour aux recettes</button><div class="hero" style="margin-top:14px"><div><div class="eyebrow">${r.category}</div><h2>${r.emoji} ${esc(r.title)}</h2><div class="meta">Préparation ${r.prep_minutes} min · Cuisson ${r.cook_minutes} min</div></div></div><div class="card"><div class="row"><b>Nombre de portions</b><select class="input" style="width:100px" onchange="S.servings=+this.value;detail()">${[1,2,3,4,5,6].map(n=>`<option ${S.servings===n?'selected':''}>${n}</option>`)}</select></div><div class="meta">Fiche de base : ${r.servings} portions · Quantités ajustées automatiquement</div><h3>Ingrédients</h3>${r.ingredients.map(i=>`<div class="ingredient">${esc(i.name)} <b style="float:right">${Number((i.quantity*scale).toFixed(1))} ${esc(i.unit)}</b></div>`).join('')}<h3>Étapes</h3><ol class="steps">${r.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><div class="notice">${esc(r.notes)}</div><h3>Nutrition estimée par portion</h3><div class="meta">${r.kcal} kcal · Protéines ${r.protein_g} g · Glucides ${r.carbs_g} g · Lipides ${r.fat_g} g</div><p class="muted">Coût estimé : ${r.cost_eur.toFixed(2)} € / portion</p><p class="muted">Provenance : ${esc(r.source)}</p><p class="muted">Statut : ${esc(r.verification)}</p><div class="actions"><button class="btn" onclick="addPlan(${r.id})">Ajouter au planning</button><button class="btn light" onclick="toggleFav(${r.id});detail()">☆ Favori</button></div></div>`}
function addPlan(id){let slot=`${S.day}-${S.meal||'midi'}`;S.plan[slot]=id;S.meal='';S.detail=null;save();go('planner');toast('Repas ajouté')}
function planner(){let days=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];$('#app').innerHTML=`<div class="eyebrow">Organisation de la semaine</div><h2>Mon planning</h2><div class="filters">${days.map((d,i)=>`<button class="filter ${S.day===i?'active':''}" onclick="S.day=${i};planner()">${d.slice(0,3)}</button>`).join('')}</div>${['midi','soir'].map(k=>{let r=get(S.plan[`${S.day}-${k}`]);return `<div class="slot"><div class="row"><b>${k==='midi'?'Déjeuner':'Dîner'}</b>${r?`<button class="filter" onclick="delete S.plan['${S.day}-${k}'];save();planner()">Retirer</button>`:''}</div>${r?`<p>${r.emoji} <b>${esc(r.title)}</b></p><div class="meta">${r.kcal} kcal · ${r.cost_eur.toFixed(2)} €/portion</div>`:'<p class="muted">Aucun repas choisi</p>'}<button class="btn light" onclick="S.meal='${k}';S.page='recipes';render()">＋ Choisir une recette</button></div>`}).join('')}<button class="btn light" onclick="S.plan={};save();planner()">Vider le planning</button>`}
function shopping(){let needs={};Object.entries(S.plan).forEach(([k,id])=>{if(!id)return;let r=get(id);r.ingredients.forEach(i=>{let key=i.name;let x=needs[key]||(needs[key]={q:0,u:i.unit});x.q+=i.quantity*S.servings/r.servings})});let rows=Object.entries(needs).map(([n,x])=>{let p=S.pantry.find(p=>p.name.toLowerCase()===n.toLowerCase());return {n,q:Math.max(0,x.q-(p?p.qty:0)),u:x.u}}).filter(x=>x.q>0);$('#app').innerHTML=`<div class="eyebrow">Préparation des achats</div><h2>Liste de courses</h2><div class="card">${rows.map(x=>`<label class="ingredient"><input type="checkbox" ${S.checked.includes(x.n)?'checked':''} onchange="S.checked=this.checked?[...S.checked,'${esc(x.n)}']:S.checked.filter(n=>n!=='${esc(x.n)}');save()"> ${esc(x.n)} <b style="float:right">${x.q.toFixed(1)} ${esc(x.u)}</b></label>`).join('')||'<p class="muted">Ajoute des recettes au planning pour générer les courses.</p>'}</div>`}
function pantry(){$('#app').innerHTML=`<div class="eyebrow">Inventaire maison</div><h2>Mon stock</h2><div class="card"><input id="pn" class="input" placeholder="Nom du produit"><div class="row"><input id="pq" class="input" type="number" min="0" placeholder="Quantité"><select id="pu" class="input"><option>g</option><option>kg</option><option>ml</option><option>cl</option><option>pièce</option></select></div><button class="btn" onclick="let n=$('#pn').value.trim(),q=+$('#pq').value;if(!n||q<0)return toast('Vérifie le produit et la quantité');S.pantry.push({name:n,qty:q,unit:$('#pu').value});save();pantry()">Ajouter au stock</button></div>${S.pantry.map((p,i)=>`<div class="card row"><b>${esc(p.name)} · ${p.qty} ${p.unit}</b><button class="filter" onclick="S.pantry.splice(${i},1);save();pantry()">Supprimer</button></div>`).join('')}`}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='cookeo-v10-sauvegarde.json';a.click()}
render();
</script></body></html>
